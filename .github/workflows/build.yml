name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Create Flutter Project Skeleton
      run: |
        cd ..
        flutter create temp_app --org com.dissabi.app
        cp -r temp_app/android dissabi/
        cp temp_app/pubspec.yaml dissabi/
        cd dissabi

        # Bağımlılıkları ekle
        sed -i '/dependencies:/a \  supabase_flutter: ^2.0.0\n  agora_rtc_engine: ^6.3.0\n  permission_handler: ^11.0.0\n  image_picker: ^1.0.0' pubspec.yaml

        # app modülünün compileSdk/targetSdk'sini sabitle
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
    - name: Get Dependencies
      run: flutter pub get
    - name: Debug - agora_rtc_engine build.gradle (BEFORE patch)
      run: |
        PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
        echo "=== Pub cache: $PUB_CACHE_DIR ==="
        AGORA_FILE=$(find "$PUB_CACHE_DIR" -ipath "*agora_rtc_engine*/android/build.gradle*" | head -n 1)
        echo "=== Bulunan dosya: $AGORA_FILE ==="
        if [ -n "$AGORA_FILE" ]; then
          cat "$AGORA_FILE"
        else
          echo "!!! agora_rtc_engine build.gradle bulunamadı, pub-cache içeriği listeleniyor:"
          find "$PUB_CACHE_DIR" -iname "*agora*" -maxdepth 6
        fi
    - name: Force compileSdk 36 on all plugin packages (pub-cache patch)
      run: |
        PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
        find "$PUB_CACHE_DIR" \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/android/*" | while read -r f; do
          sed -i -E \
            -e 's/compileSdkVersion[[:space:]]*\(?[[:space:]]*flutter\.compileSdkVersion[[:space:]]*\)?/compileSdkVersion 36/g' \
            -e 's/compileSdkVersion[[:space:]]*\(?[[:space:]]*[0-9]+[[:space:]]*\)?/compileSdkVersion 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            -e 's/android\.compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/android.compileSdkVersion = 36/g' \
            "$f"
        done
    - name: Debug - agora_rtc_engine build.gradle (AFTER patch)
      run: |
        PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
        AGORA_FILE=$(find "$PUB_CACHE_DIR" -ipath "*agora_rtc_engine*/android/build.gradle*" | head -n 1)
        if [ -n "$AGORA_FILE" ]; then
          echo "=== Patch sonrası: $AGORA_FILE ==="
          cat "$AGORA_FILE"
        fi
    - name: Build APK
      run: flutter build apk --split-per-abi --release --no-tree-shake-icons
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dissabi-app
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
