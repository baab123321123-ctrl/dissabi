name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Create Flutter Project Skeleton & Force SDK 36
      run: |
        cd ..
        flutter create temp_app --org com.dissabi.app
        cp -r temp_app/android dissabi/
        cp temp_app/pubspec.yaml dissabi/
        cd dissabi

        # Bağımlılıkları ekle
        sed -i '/dependencies:/a \  supabase_flutter: ^2.0.0\n  agora_rtc_engine: ^6.3.0\n  permission_handler: ^11.0.0\n  image_picker: ^1.0.0' pubspec.yaml

        # app modülünün compileSdk/targetSdk'sini sabitle
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts

        # TÜM alt modülleri (agora_rtc_engine dahil) finalizeDsl ile SDK 36'ya zorla (AGP9-safe, afterEvaluate kullanmaz)
        cat >> android/build.gradle.kts << 'EOF'
        subprojects {
            plugins.withType<com.android.build.gradle.BasePlugin> {
                extensions.getByType(com.android.build.api.variant.AndroidComponentsExtension::class.java)
                    .finalizeDsl {
                        it.compileSdk = 36
                    }
            }
        }
        EOF
    - name: Get Dependencies
      run: flutter pub get
    - name: Build APK
      run: flutter build apk --split-per-abi --release --no-tree-shake-icons
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dissabi-app
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
