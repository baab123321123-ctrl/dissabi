name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Flutter Project Skeleton & Fix SDK
      run: |
        cd ..
        flutter create temp_app --org com.dissabi.app
        cp -r temp_app/android dissabi/
        cp temp_app/pubspec.yaml dissabi/
        cd dissabi
        
        # Bağımlılıkları ekle
        sed -i '/dependencies:/a \  supabase_flutter: ^2.0.0\n  agora_rtc_engine: ^6.3.0\n  permission_handler: ^11.0.0\n  image_picker: ^1.0.0' pubspec.yaml
        
        # Compile SDK sürümünü 34'e yükselt (Agora hatasını çözer)
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --split-per-abi --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dissabi-app
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
